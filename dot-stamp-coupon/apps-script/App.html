<script>
(function () {
  var S = { name: null, ym: null, data: null, admin: null, threshold: 300, today: null, gameReady: false };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
  };

  /* ── 서버 호출 ── */
  var pending = 0;
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      pending++; $('loading').classList.remove('hidden');
      var done = function () { if (--pending <= 0) { pending = 0; $('loading').classList.add('hidden'); } };
      var r = google.script.run
        .withSuccessHandler(function (res) { done(); resolve(res); })
        .withFailureHandler(function (err) { done(); toast((err && err.message) || String(err)); }); // 실패 시 토스트만 표시
      r[fn].apply(r, args);
    });
  }
  function quiet(fn) { // 로딩 표시 없는 호출
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }

  var toastT;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('hidden'); }, 2600);
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('active', s.id === id); });
  }
  var modalOnClose = null;
  function openModal(html, opts) {
    opts = opts || {};
    if (modalOnClose) { var f = modalOnClose; modalOnClose = null; f(); }
    $('modal-box').className = 'px-box modal-box ' + (opts.cls || '');
    $('modal').className = 'modal ' + (opts.cls ? opts.cls + '-wrap' : '');
    $('modal-box').innerHTML = html; Sprites.hydrate($('modal-box'));
    modalOnClose = opts.onClose || null;
  }
  function closeModal() {
    $('modal').classList.add('hidden');
    if (modalOnClose) { var f = modalOnClose; modalOnClose = null; f(); }
  }

  function stampHTML(status) {
    if (status === '승인') return Sprites.get('stamp-pass');
    if (status === '비승인') return Sprites.get('stamp-fail');
    return '';
  }
  function fmtDate(d) { var p = d.split('-'); var w = '일월화수목금토'[new Date(+p[0], p[1] - 1, +p[2]).getDay()]; return (+p[1]) + '월 ' + (+p[2]) + '일 (' + w + ')'; }

  /* ── 로그인 ── */
  document.querySelectorAll('[data-login-tab]').forEach(function (b) {
    b.onclick = function () {
      var t = b.getAttribute('data-login-tab');
      document.querySelectorAll('[data-login-tab]').forEach(function (x) { x.classList.toggle('active', x === b); });
      $('form-user').classList.toggle('hidden', t !== 'user');
      $('form-admin').classList.toggle('hidden', t !== 'admin');
    };
  });

  $('form-user').onsubmit = function (e) {
    e.preventDefault();
    var name = $('in-user-name').value.trim();
    if (!name) return toast('이름을 입력하세요.');
    call('userLogin', name).then(function (data) {
      S.name = data.name; store.set('dot_user', data.name);
      enterUser(data);
    });
  };

  $('form-admin').onsubmit = function (e) {
    e.preventDefault();
    var auth = { name: $('in-admin-name').value.trim(), password: $('in-admin-pw').value };
    call('adminLogin', auth).then(function (res) {
      S.admin = auth; S.today = res.today; S.threshold = res.threshold;
      $('in-admin-pw').value = '';
      $('a-name').textContent = res.name;
      $('f-date').value = '';
      show('scr-admin');
      adminTab('rec');
    });
  };

  function logout() {
    FruitGame.stop();
    G.sid = null; G.gen = (G.gen || 0) + 1; G.queue = [];
    S.name = null; S.admin = null; S.data = null;
    $('toast').classList.add('hidden'); closeModal();
    store.set('dot_user', null);
    show('scr-login');
  }

  /* ── 사용자 화면 ── */
  function enterUser(data) {
    $('u-name').textContent = data.name;
    show('scr-user');
    userPane('pane-cal');
    applyMonth(data);
  }

  function applyMonth(data, opts) {
    var old = S.data;
    S.data = data; S.ym = data.ym; S.today = data.today; S.threshold = data.threshold;
    renderToday(); renderCalendar(); renderCoupons(); renderStampChip(old);
    if (opts && opts.notify && old && old.ym === data.ym) notifyChanges(old, data);
  }

  function curWallet(d) {
    var ym = d.today.slice(0, 7);
    return d.wallets.filter(function (w) { return w.ym === ym; })[0] || d.wallets[0];
  }
  function renderStampChip(old) {
    var w = curWallet(S.data), el = $('hdr-stamp');
    el.textContent = w.balance;
    if (old && curWallet(old).balance !== w.balance) { var c = el.parentNode; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  }
  /** 관리자 처리 등으로 바뀐 도장을 알려주고 해당 칸에 효과 */
  function notifyChanges(old, d) {
    var msgs = [];
    Object.keys(d.records).forEach(function (k) {
      var a = old.records[k], b = d.records[k];
      if ((a && a.status) === b.status) return;
      var cell = document.querySelector('.cell[data-date="' + k + '"]');
      if (cell) cell.classList.add('fresh');
      if (b.status === '승인') msgs.push('🎉 ' + fmtDate(k) + ' 합격 도장이 찍혔어요!');
      else if (b.status === '비승인') msgs.push(fmtDate(k) + ' 기록이 비승인됐어요.');
    });
    var nc = d.coupons.filter(function (c) { return !c.used; }).length, oc = old.coupons.filter(function (c) { return !c.used; }).length;
    if (nc > oc) msgs.push('🎟 새 쿠폰이 도착했어요!');
    if (msgs.length) toast(msgs.length > 2 ? msgs[0] + ' 외 ' + (msgs.length - 1) + '건' : msgs.join(' / '));
  }

  /* ── 자동 갱신: 10초마다 + 화면으로 돌아왔을 때 변경 번호 확인 ── */
  var syncing = false;
  function syncUser() {
    if (!S.name || !S.data || syncing || !$('scr-user').classList.contains('active')) return;
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    syncing = true;
    var name = S.name;
    quiet('getUserRev', name).then(function (r) {
      if (name !== S.name || !S.data || r.rev === S.data.rev) { syncing = false; return; }
      return quiet('getUserMonth', name, S.ym).then(function (d) {
        syncing = false;
        if (name === S.name) applyMonth(d, { notify: true });
      });
    }).catch(function () { syncing = false; });
  }
  setInterval(syncUser, 10000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') syncUser(); });
  window.addEventListener('focus', syncUser);

  function loadMonth(ym) { return call('getUserMonth', S.name, ym).then(applyMonth); }

  function renderToday() {
    var t = S.today, box = $('today-box');
    var rec = (S.ym === t.slice(0, 7)) ? S.data.records[t] : null;
    // 다른 달을 보고 있어도 오늘 정보는 유지: 오늘 달이 아니면 캐시 사용
    if (S.ym === t.slice(0, 7)) S.todayRec = rec || null;
    rec = S.todayRec;
    var cls = rec ? (rec.pass ? 'pass' : 'fail') : '';
    var stamp, val, msg;
    if (!rec) {
      stamp = '<div class="empty-box">?</div>';
      val = '<span style="color:var(--muted)">- - -</span>';
      msg = '오늘 운동 기록을 입력하세요! (' + S.threshold + ' 이상 통과)';
    } else {
      stamp = rec.status === '대기' ? '<div class="empty-box" style="font-size:1em;padding:12%">' + Sprites.get('hourglass') + '</div>' : stampHTML(rec.status);
      val = (rec.value == null ? '★' : rec.value) + (rec.granted ? ' <small>관리자 도장</small>' : rec.pass ? ' <small>통과!</small>' : ' <small>미통과</small>');
      msg = rec.status === '대기' ? '관리자 확인을 기다리는 중...' : rec.status === '승인' ? '승인 도장 획득! 🎉' : '이번엔 비승인이에요. 내일 다시!';
    }
    box.className = 'today px-box ' + cls;
    box.innerHTML =
      '<div class="t-stamp">' + stamp + '</div>' +
      '<div class="t-info"><div class="t-date">TODAY · ' + fmtDate(t) + '</div>' +
      '<div class="t-val">' + val + '</div><div class="t-msg">' + msg + '</div></div>' +
      ((!rec || rec.status === '대기') ? '<button class="btn btn-s btn-yellow" data-action="input" data-date="' + t + '">' + (rec ? '수정' : '기록') + '</button>' : '');
  }

  function renderCalendar() {
    var p = S.ym.split('-'), y = +p[0], m = +p[1];
    $('cal-title').textContent = y + '. ' + (m < 10 ? '0' + m : m);
    var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    var html = '';
    for (var i = 0; i < first; i++) html += '<div class="cell blank"></div>';
    for (var d = 1; d <= days; d++) {
      var ds = S.ym + '-' + (d < 10 ? '0' + d : d), rec = S.data.records[ds];
      var cls = 'cell';
      if (ds > S.today) cls += ' future';
      if (rec) cls += rec.pass ? ' pass' : ' fail';
      if (ds === S.today) cls += ' today';
      var inner = '<span class="dn">' + d + '</span>';
      if (rec) {
        inner += '<span class="dv">' + (rec.value == null ? '★' : rec.value) + '</span>';
        if (rec.status === '대기') inner += '<span class="pend">' + Sprites.get('hourglass') + '</span>';
        else inner += '<span class="st">' + stampHTML(rec.status) + '</span>';
      }
      html += '<button class="' + cls + '" data-action="input" data-date="' + ds + '">' + inner + '</button>';
    }
    $('cal-grid').innerHTML = html;
    var cur = S.today.slice(0, 7);
    document.querySelector('[data-action="next-month"]').disabled = S.ym >= cur;
  }

  function shiftMonth(delta) {
    var p = S.ym.split('-'), dt = new Date(+p[0], +p[1] - 1 + delta, 1);
    var ym = dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2);
    if (ym > S.today.slice(0, 7)) return;
    loadMonth(ym);
  }

  function openInput(date) {
    if (date > S.today) return toast('미래 날짜는 기록할 수 없어요.');
    var rec = S.data.records[date];
    if (rec && rec.status !== '대기') {
      return openModal(
        '<h3>' + fmtDate(date) + '</h3><div class="center"><div class="big-stamp">' + stampHTML(rec.status) + '</div>' +
        '<p>운동 수치 <b>' + (rec.value == null ? '-' : rec.value) + '</b> · ' + (rec.pass ? '통과' : '미통과') + '</p>' +
        (rec.granted ? '<p class="hint">' + esc(rec.note) + '</p>' : '') +
        '<p class="hint">관리자가 <b>' + rec.status + '</b> 처리한 기록이에요.</p></div>' +
        '<div class="actions"><button class="btn btn-dark" data-action="close">닫기</button></div>');
    }
    openModal(
      '<h3>' + fmtDate(date) + ' 운동 기록</h3>' +
      '<input class="big-input" id="m-val" type="number" inputmode="numeric" min="0" max="100000" placeholder="0" value="' + (rec ? rec.value : '') + '">' +
      '<div class="quick">' + [10, 50, 100, -10].map(function (n) { return '<button class="btn btn-dark" data-action="quick" data-n="' + n + '">' + (n > 0 ? '+' : '') + n + '</button>'; }).join('') + '</div>' +
      '<div class="judge" id="m-judge">수치를 입력하세요</div>' +
      '<p class="hint">' + S.threshold + ' 이상이면 통과! 저장 후 관리자가 승인하면 도장이 찍혀요.</p>' +
      '<div class="actions"><button class="btn btn-dark" data-action="close">취소</button>' +
      '<button class="btn btn-green" data-action="save" data-date="' + date + '">저장</button></div>');
    var inp = $('m-val');
    inp.oninput = judge; judge();
    setTimeout(function () { inp.focus(); }, 50);
  }
  function judge() {
    var v = $('m-val').value, j = $('m-judge');
    if (v === '') { j.className = 'judge'; j.textContent = '수치를 입력하세요'; return; }
    var pass = Number(v) >= S.threshold;
    j.className = 'judge ' + (pass ? 'pass' : 'fail');
    j.textContent = pass ? '★ 통과! (' + v + ' ≥ ' + S.threshold + ')' : '✕ 미통과 (' + (S.threshold - Number(v)) + ' 부족)';
  }

  function saveInput(date) {
    var v = $('m-val').value;
    if (v === '') return toast('수치를 입력하세요.');
    call('saveRecord', S.name, date, v).then(function (data) {
      closeModal(); applyMonth(data);
      toast(Number(v) >= S.threshold ? '저장 완료! 통과 기준 달성 🟩' : '저장 완료! 아직 기준 미달 🟥');
    });
  }

  function renderCoupons() {
    var d = S.data;
    var have = d.coupons.filter(function (c) { return !c.used; });
    var used = d.coupons.filter(function (c) { return c.used; });
    $('hdr-cp').textContent = have.length;
    $('cp-have-n').textContent = have.length;
    $('nav-cp').textContent = have.length;
    $('nav-cp').classList.toggle('hidden', !have.length);
    $('cp-have').innerHTML = have.length ? have.map(function (c) { return couponHTML(c); }).join('') +
      '<p class="hint">쿠폰 코드를 관리자에게 보여주면 사용 처리돼요.</p>'
      : '<div class="empty">보유 중인 쿠폰이 없어요.<br>도장을 모아 [도장 교환]에서 바꿔보세요!</div>';
    $('cp-used').innerHTML = used.length ? used.map(function (c) { return couponHTML(c); }).join('') : '<div class="empty">사용한 쿠폰이 없어요.</div>';

    var ws = d.wallets;
    if (!S.walletYm || !ws.some(function (w) { return w.ym === S.walletYm; })) S.walletYm = ws[0].ym;
    var w = ws.filter(function (x) { return x.ym === S.walletYm; })[0];
    var stampRewards = d.rewards.filter(function (r) { return !r.perfect; });
    var maxCost = stampRewards.reduce(function (m, r) { return Math.max(m, r.cost); }, 7);
    var rowsN = Math.ceil(maxCost / 7), board = '';
    for (var i = 0; i < rowsN * 7; i++) {
      board += '<div class="slot">' + (i < w.balance ? Sprites.get('stamp-pass') : (i + 1)) + '</div>';
      if (i % 7 === 6) {
        var g = stampRewards.filter(function (r) { return r.cost === i + 1; })[0];
        board += '<div class="goal' + (g && w.balance >= g.cost ? ' on' : '') + '">' + (g ? '<span>' + Sprites.get(g.icon) + '</span>' : '') + '</div>';
      }
    }
    $('cp-wallet').innerHTML =
      (ws.length > 1 ? '<div class="w-month">' + ws.map(function (x) {
        return '<button class="btn btn-s ' + (x.ym === S.walletYm ? 'btn-blue' : 'btn-dark') + '" data-action="wallet-month" data-ym="' + x.ym + '">' + (+x.ym.slice(5)) + '월 도장</button>';
      }).join('') + '</div>' : '') +
      '<div class="w-big"><span>' + (+w.ym.slice(5)) + '월 보유 도장</span><b>' + w.balance + '개</b></div>' +
      '<div class="w-sub">승인 도장 ' + w.approved + '개 · 교환에 사용 ' + w.used + '개 · 출석 ' + w.approved + '/' + w.days + '일</div>' +
      '<div class="board">' + board + '</div>';

    $('cp-rewards').innerHTML = d.rewards.map(function (r) {
      var ok, prog, info, label = '교환';
      if (r.perfect) {
        var claimed = w.claimed.indexOf(r.id) >= 0;
        ok = w.perfect && !claimed; prog = Math.min(1, w.approved / w.days);
        info = '만근 ' + w.approved + '/' + w.days + '일' + (claimed ? ' · 수령 완료' : '');
        if (claimed) label = '받음';
      } else {
        ok = w.balance >= r.cost; prog = Math.min(1, w.balance / r.cost);
        info = '도장 ' + r.cost + '개 사용' + (ok ? '' : ' · ' + (r.cost - w.balance) + '개 부족');
      }
      return '<div class="reward px-box' + (ok ? ' ok' : '') + '">' +
        '<div class="rw-ico">' + Sprites.get(r.icon) + '</div>' +
        '<div class="rw-body"><div class="rw-name">' + esc(r.name) + '</div><div class="rw-desc">' + esc(r.desc) + '</div>' +
        '<div class="rw-desc">' + info + '</div><div class="rw-bar"><i style="width:' + Math.round(prog * 100) + '%"></i></div></div>' +
        '<button class="btn btn-s ' + (ok ? 'btn-green' : 'btn-dark') + '" data-action="exchange" data-id="' + esc(r.id) + '"' + (ok ? '' : ' disabled') + '>' + label + '</button></div>';
    }).join('');
  }

  function cpTab(t) {
    document.querySelectorAll('[data-cp-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-cp-tab') === t); });
    ['have', 'shop', 'used'].forEach(function (k) { $('cp-' + k).classList.toggle('hidden', k !== t); });
  }

  function askExchange(id) {
    var r = S.data.rewards.filter(function (x) { return x.id === id; })[0];
    var w = S.data.wallets.filter(function (x) { return x.ym === S.walletYm; })[0];
    if (!r || !w) return;
    openModal('<h3>도장 교환</h3><div class="center"><div class="big-stamp" style="transform:none;width:30%">' + Sprites.get(r.icon) + '</div>' +
      '<p><b>' + esc(r.name) + '</b><br><small>' + esc(r.desc) + '</small></p>' +
      (r.perfect ? '<p class="hint">' + (+w.ym.slice(5)) + '월 만근 보상이에요. 도장은 줄어들지 않아요.</p>'
        : '<p>' + (+w.ym.slice(5)) + '월 도장 <b>' + w.balance + '개 → ' + (w.balance - r.cost) + '개</b></p><p class="hint">교환한 도장은 사라지고, 남은 도장부터 다시 모아요.</p>') +
      '</div><div class="actions"><button class="btn btn-dark" data-action="close">취소</button>' +
      '<button class="btn btn-green" data-action="do-exchange" data-id="' + esc(id) + '">교환하기</button></div>');
  }

  function doExchange(id) {
    var keepYm = S.ym;
    call('exchangeReward', S.name, id, S.walletYm).then(function (data) {
      var c = data.newCoupon;
      // 달력은 보던 달 유지
      if (keepYm !== data.ym) { data.records = S.data.records; data.ym = keepYm; }
      applyMonth(data);
      cpTab('have');
      openModal('<h3>🎉 쿠폰 발급 완료!</h3><div class="coupon-list">' +
        couponHTML({ code: c.code, rewardName: c.rewardName, desc: c.desc, icon: c.icon, ym: c.ym, issuedAt: '방금', used: false }) + '</div>' +
        (c.cost ? '<p class="hint">' + (+c.ym.slice(5)) + '월 남은 도장 ' + c.balanceAfter + '개</p>' : '') +
        '<div class="actions"><button class="btn btn-green" data-action="close">확인</button></div>');
    });
  }

  function couponHTML(c, admin) {
    var gk = GRADE_KEY[c.grade] || 'normal';
    return '<div class="coupon ' + (c.used ? 'used' : '') + (c.game ? ' game g-' + gk : '') + '">' +
      '<div class="c-ico">' + Sprites.get(c.icon || 'ticket') + '</div>' +
      '<div class="c-body">' +
        '<div class="c-top">' + (c.game ? '<span class="gb gb-' + gk + '">' + esc(c.grade) + '</span>' : '') +
          '<span class="c-tag">' + (c.used ? '사용완료' : '사용가능') + '</span></div>' +
        '<div class="c-code">' + esc(c.rewardName) + '</div>' +
        '<div class="c-meta">' + (admin === true ? '<b>' + esc(c.name) + '</b> · ' : '') + esc(c.desc) + '</div>' +
        '<div class="c-meta">코드 <b>' + esc(c.code) + '</b></div>' +
        '<div class="c-meta">' + (c.game ? '🎮 미니게임 보상 · ' : c.ym ? (+c.ym.slice(5)) + '월 도장 · ' : '') + '발급 ' + esc(c.issuedAt) + (c.used ? ' · 사용 ' + esc(c.usedAt) : '') + '</div>' +
        (admin === true ? '<button class="btn btn-s c-btn ' + (c.used ? 'btn-dark' : 'btn-red') + '" data-action="use-coupon" data-code="' + esc(c.code) + '">' + (c.used ? '되돌리기' : '사용처리') + '</button>' : '') +
      '</div></div>';
  }

  function userPane(id) {
    document.querySelectorAll('#scr-user .pane').forEach(function (p) { p.classList.toggle('active', p.id === id); });
    document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-pane') === id); });
    if (id === 'pane-game') {
      if (!S.gameReady) {
        S.gameReady = true;
        FruitGame.init({
          onScore: onGameScore,
          onReset: onGameReset,
          onLockedTap: function () { showGameIntro(); },
          onOver: onGameOver,
        });
        setInterval(tickPlays, 1000);
      }
      if (G.owner !== S.name) { G.owner = S.name; FruitGame.reset(); }
      FruitGame.start();
      processDrops();
    } else if (S.gameReady) FruitGame.stop();
  }

  /* ── 미니게임 점수 보상 ── */
  var G = { sid: null, info: null, start: 2500, step: 500, next: 2500, queue: [], rolling: false, limitedShown: false };

  /* 플레이 횟수 */
  var P = { plays: null, offset: 0, fetching: false };
  function setPlays(pl) {
    if (!pl) return;
    P.plays = pl; P.offset = pl.now - Date.now();
    renderPlays();
  }
  function fmtLeft(ms) {
    var t = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(t / 60), sec = t % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function playsLeftMs() { return P.plays && P.plays.nextAt ? P.plays.nextAt - (Date.now() + P.offset) : null; }
  function renderPlays() {
    var pl = P.plays; if (!pl) return;
    var h = '';
    for (var i = 0; i < pl.max; i++) h += '<i class="hp' + (i < pl.count ? ' on' : '') + '"></i>';
    $('g-hearts').innerHTML = h;
    var left = playsLeftMs();
    $('g-ptime').textContent = pl.count >= pl.max ? 'FULL' : fmtLeft(left);
    var it = $('m-plays-left'); if (it) it.textContent = pl.count >= pl.max ? '' : '다음 충전까지 ' + fmtLeft(left);
  }
  function tickPlays() {
    if (!P.plays || !$('pane-game').classList.contains('active')) return;
    var left = playsLeftMs();
    if (left != null && left <= 0 && !P.fetching) { P.fetching = true; refreshGameStatus().then(function () { P.fetching = false; }, function () { P.fetching = false; }); }
    renderPlays();
  }
  function refreshGameStatus() {
    return quiet('getGameStatus', S.name).then(function (r) { setPlays(r.plays); renderRecords(r.ranking); return r; });
  }
  function renderRecords(rk) {
    if (!rk) return;
    S.rank = rk;
    $('g-today').textContent = rk.today.best ? rk.today.best.score : '-';
    $('g-week').textContent = rk.week.best ? rk.week.best.score : '-';
    $('g-today').parentNode.title = rk.today.best ? '오늘 최고: ' + rk.today.best.name : '';
    $('g-week').parentNode.title = rk.week.best ? '주간 최고: ' + rk.week.best.name : '';
  }

  function onGameReset() {
    G.owner = S.name;
    if (!S.name) return;
    G.sid = null; G.queue = []; G.rolling = false; G.limitedShown = false;
    G.next = G.start; updateGiftBar(0);
    $('g-score').textContent = 0;
    var gen = (G.gen = (G.gen || 0) + 1);
    refreshGameStatus().then(function () { if (gen === G.gen && !FruitGame.isOver()) showGameIntro(); })
      .catch(function () { if (gen === G.gen) showGameIntro(); });
  }

  var INTROS = [
    ['📜', '낡은 쪽지가 떨어져 있다...', '「{S}점... 그 너머에서 무언가가 떨어진다는 소문이 있다.<br>점수가 오를수록... 더 귀한 것이...」'],
    ['🔮', '수정구슬이 희미하게 빛난다...', '「{S}점을 넘어서는 자에게<br>특별한 선물이 내려지리라...」'],
    ['🐱', '길고양이가 다가와 속삭였다...', '「야옹... {S}점... 넘으면...<br>좋은 거... 나올지도... 냥...」'],
    ['📻', '지지직... 수상한 무전이 들려온다...', '「...여기는 본부... {S}점 돌파 시...<br>보급품 투하 가능성 있음... 이상...」'],
  ];
  function showGameIntro() {
    if (G.sid) return;
    var t = INTROS[Math.floor(Math.random() * INTROS.length)];
    var st = G.start.toLocaleString(), pl = P.plays, none = pl && pl.count <= 0;
    var hearts = ''; if (pl) for (var i = 0; i < pl.max; i++) hearts += '<i class="hp' + (i < pl.count ? ' on' : '') + '"></i>';
    openModal(
      '<div class="intro"><div class="intro-ico"><span data-sprite="gift"></span><b class="q blink">?</b></div>' +
      '<p class="intro-a">' + t[0] + ' ' + t[1] + '</p>' +
      '<p class="intro-b">' + t[2].replace('{S}', st) + '</p>' +
      '<p class="hint center">※ 반드시 나오는 건 아니에요. 운이 좋다면...?</p>' +
      (pl ? '<div class="intro-plays"><span class="hearts">' + hearts + '</span> 남은 플레이 <b>' + pl.count + '/' + pl.max + '</b><br><small id="m-plays-left"></small></div>' : '') +
      (none ? '<p class="hint center">플레이 횟수를 모두 썼어요. ' + (pl.recoverMin || 30) + '분마다 1회 충전 · 매일 0시 가득 충전 · <b>최고 기록</b>을 깨면 전부 회복!</p>' : '') +
      '</div>' +
      '<div class="actions"><button class="btn btn-dark" data-action="game-info">?</button>' +
      '<button class="btn btn-green" data-action="game-go"' + (none ? ' disabled' : '') + '>' + (none ? '충전 중...' : '도전한다! (♥1)') + '</button></div>',
      { cls: 'intro-box' });
    renderPlays();
  }

  function startGame() {
    var gen = G.gen;
    call('startGameSession', S.name).then(function (r) {
      if (gen !== G.gen) return;
      setPlays(r.plays);
      if (r.noPlays) { showGameIntro(); return; }
      G.sid = r.sessionId; G.info = r.info; G.start = r.info.start; G.step = r.info.step; G.next = G.start;
      updateGiftBar(0);
      closeModal();
      FruitGame.setLocked(false);
    });
  }

  function onGameOver(score, maxLv) {
    $('g-saved').textContent = '기록 저장 중...';
    $('g-over-plays').textContent = '';
    var sid = G.sid; G.sid = null;
    quiet('saveGameScore', S.name, score, maxLv, sid).then(function (r) {
      setPlays(r.plays); renderRecords(r);
      var pl = r.plays;
      $('g-saved').textContent = '저장 완료! 이번 달 내 최고 ' + r.month.my + '점';
      $('g-over-plays').textContent = '남은 플레이 ' + pl.count + '/' + pl.max + (pl.count < pl.max ? ' · 다음 충전 ' + fmtLeft(pl.nextAt - pl.now) : '');
      if (r.records && r.records.length) showRecordFx(score, r.records, pl);
    }).catch(function (e) { $('g-saved').textContent = '저장 실패: ' + ((e && e.message) || '네트워크 확인'); });
  }

  function showRecordFx(score, recs, pl) {
    var parts = '';
    for (var i = 0; i < 24; i++) {
      var ang = (i / 24) * Math.PI * 2, dist = 60 + Math.random() * 70;
      parts += '<i style="--dx:' + Math.round(Math.cos(ang) * dist) + 'px;--dy:' + Math.round(Math.sin(ang) * dist) + 'px;--d:' + (Math.random() * .2).toFixed(2) + 's"></i>';
    }
    openModal('<div class="fx fx-legend open rec-fx"><div class="fx-rays"></div><div class="fx-parts">' + parts + '</div><div class="fx-phase2">' +
      '<div class="fx-grade">NEW RECORD!</div>' +
      '<div class="fx-card"><div class="fx-name">' + recs.map(function (x) { return x + ' 최고 기록'; }).join(' + ') + ' 달성!</div>' +
      '<div class="fx-desc">' + score.toLocaleString() + '점</div>' +
      '<div class="intro-plays" style="margin-top:.5em"><span class="hearts">' + Array(pl.max + 1).join('<i class="hp on"></i>') + '</span> 플레이 횟수 <b>모두 회복!</b></div></div>' +
      '<div class="actions"><button class="btn btn-green" data-action="close">좋아!</button></div></div></div>', { cls: 'fx-box' });
  }

  function updateGiftBar(score) {
    var el = $('g-gifttxt');
    if (score < G.start) el.innerHTML = '<b>' + G.start.toLocaleString() + '</b>점을 넘으면...?';
    else el.innerHTML = '다음 두근두근 <b>' + G.next.toLocaleString() + '</b>점';
    $('g-giftbar').classList.toggle('hot', score >= G.start);
  }

  function onGameScore(score) {
    $('g-score').textContent = score;
    if (G.sid) {
      while (score >= G.next) { G.queue.push(G.next); G.next += G.step; }
      processDrops();
    }
    updateGiftBar(score);
  }

  function processDrops() {
    if (G.rolling || !G.queue.length || !G.sid) return;
    if (!$('pane-game').classList.contains('active') || !$('scr-user').classList.contains('active')) return; // 게임 화면으로 돌아오면 이어서 추첨
    G.rolling = true;
    var th = G.queue.shift();
    quiet('rollGameDrop', S.name, G.sid, th, FruitGame.getScore()).then(function (r) {
      G.rolling = false;
      if (r.dropped) { showDrop(r); return; }
      if (r.limited) { if (!G.limitedShown) toast('🎁 오늘 받을 수 있는 선물(' + r.limit + '개)을 모두 받았어요. 내일 또 만나요!'); G.limitedShown = true; }
      else if (!r.duplicate) toast(pick(['✨ ' + th.toLocaleString() + '점 돌파! ...아무 일도 일어나지 않았다.', '✨ ' + th.toLocaleString() + '점! 무언가 스쳐 지나갔다... 다음엔...?', '✨ ' + th.toLocaleString() + '점! 바람 소리만 들린다...']));
      processDrops();
    }).catch(function () { G.rolling = false; processDrops(); });
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  var GRADE_KEY = { '노멀': 'normal', '레어': 'rare', '에픽': 'epic', '레전드': 'legend' };
  var GRADE_EN = { '노멀': 'NORMAL', '레어': 'RARE!', '에픽': 'EPIC!!', '레전드': 'LEGEND!!!' };

  function showDrop(r) {
    var key = GRADE_KEY[r.grade] || 'normal', parts = '';
    for (var i = 0; i < 28; i++) {
      var ang = (i / 28) * Math.PI * 2, dist = 70 + Math.random() * 80;
      parts += '<i style="--dx:' + Math.round(Math.cos(ang) * dist) + 'px;--dy:' + Math.round(Math.sin(ang) * dist) + 'px;--d:' + (Math.random() * .25).toFixed(2) + 's"></i>';
    }
    openModal(
      '<div class="fx fx-' + key + '">' +
        '<div class="fx-rays"></div><div class="fx-parts">' + parts + '</div>' +
        '<div class="fx-phase1"><div class="fx-gift"><span data-sprite="gift"></span></div><p class="blink">두근두근...</p></div>' +
        '<div class="fx-phase2">' +
          '<p class="fx-score">' + r.threshold.toLocaleString() + '점 돌파 보상!</p>' +
          '<div class="fx-grade">' + GRADE_EN[r.grade] + '</div>' +
          '<div class="fx-card"><span class="gb gb-' + key + '">' + esc(r.grade) + '</span>' +
            '<div class="fx-name">' + esc(r.rewardName) + '</div><div class="fx-desc">' + esc(r.desc) + '</div>' +
            '<div class="fx-code">' + esc(r.code) + '</div></div>' +
          '<p class="hint center">쿠폰함에 저장됐어요!' + (r.remainingToday != null ? ' (오늘 남은 선물 ' + Math.max(0, r.remainingToday) + '개)' : '') + '</p>' +
          '<div class="actions"><button class="btn btn-dark" data-action="goto-coupon">쿠폰함</button><button class="btn btn-green" data-action="close">계속하기</button></div>' +
        '</div>' +
      '</div>',
      { cls: 'fx-box', onClose: function () { refreshCoupons(); processDrops(); } });
    setTimeout(function () { var f = document.querySelector('#modal-box .fx'); if (f) f.classList.add('open'); }, 1100);
  }

  function refreshCoupons() {
    quiet('getUserMonth', S.name, S.ym).then(applyMonth).catch(function () {});
  }

  function showGameInfo() {
    var go = function (info) {
      var rows = info.table.map(function (t) {
        return '<tr><td>' + t.score.toLocaleString() + '+</td><td><b>' + t.chance + '%</b></td>' +
          ['노멀', '레어', '에픽', '레전드'].map(function (g) { return '<td>' + t.grades[g] + '</td>'; }).join('') + '</tr>';
      }).join('');
      var byGrade = ['노멀', '레어', '에픽', '레전드'].map(function (g) {
        return '<div class="ri"><span class="gb gb-' + GRADE_KEY[g] + '">' + g + '</span> ' +
          info.rewards.filter(function (x) { return x.grade === g; }).map(function (x) { return esc(x.name); }).join(', ') + '</div>';
      }).join('');
      openModal('<h3>🎁 비밀 보상 정보</h3>' +
        '<p class="hint">' + info.start.toLocaleString() + '점부터 ' + info.step.toLocaleString() + '점마다 한 번씩 추첨! 높을수록 확률과 등급이 올라가요.</p>' +
        '<div class="tbl-wrap"><table class="tbl tbl-s"><tr><th>점수</th><th>당첨</th><th>노멀</th><th>레어</th><th>에픽</th><th>레전드</th></tr>' + rows + '</table></div>' +
        byGrade +
        (info.limit > 0 ? '<p class="hint">하루 최대 ' + info.limit + '개' + (info.remainingToday != null ? ' · 오늘 남은 선물 ' + info.remainingToday + '개' : '') + '</p>' : '') +
        '<div class="actions"><button class="btn btn-green" data-action="close">닫기</button></div>');
    };
    if (G.info) go(G.info); else call('startGameSession', S.name).then(function (r) { G.info = r.info; go(r.info); });
  }

  function showRanking(tab) {
    tab = tab || 'today';
    call('getGameRanking', S.name).then(function (r) {
      renderRecords(r);
      var b = r[tab], label = { today: '오늘', week: '이번 주', month: '이번 달' }[tab];
      var tabs = ['today', 'week', 'month'].map(function (k) {
        return '<button class="stab' + (k === tab ? ' active' : '') + '" data-action="rank-tab" data-tab="' + k + '">' + { today: '오늘 최고', week: '주간 최고', month: '이번 달' }[k] + '</button>';
      }).join('');
      openModal('<h3>🏆 과일 합치기 순위</h3><div class="sub-tabs">' + tabs + '</div>' +
        (b.top.length ? '<table class="tbl"><tr><th>#</th><th>이름</th><th>' + label + ' 최고점</th></tr>' +
          b.top.map(function (x, i) { return '<tr' + (x.name === S.name ? ' style="background:#ffcd75"' : '') + '><td>' + (i === 0 ? '👑' : i + 1) + '</td><td>' + esc(x.name) + '</td><td>' + x.score + '</td></tr>'; }).join('') + '</table>'
          : '<p class="empty" style="color:var(--muted)">아직 기록이 없어요.</p>') +
        '<p class="hint">내 ' + label + ' 최고 ' + b.my + '점' + (tab === 'week' ? ' · 이번 주 ' + fmtDate(r.weekStart) + '부터' : '') + '</p>' +
        '<p class="hint">※ 오늘·주간 최고 기록을 깨면 플레이 횟수 전부 회복! 모든 기록은 매달 1일에 초기화돼요.</p>' +
        '<div class="actions"><button class="btn btn-dark" data-action="close">닫기</button></div>');
    });
  }

  /* ── 관리자 화면 ── */
  function adminTab(t) {
    document.querySelectorAll('[data-admin-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-admin-tab') === t); });
    document.querySelectorAll('#scr-admin .pane').forEach(function (p) { p.classList.toggle('active', p.id === 'apane-' + t); });
    if (t === 'rec') adminSearch();
    if (t === 'grant') {
      if (!$('g-date').value) $('g-date').value = S.today;
      if (!$('g-date2').value) $('g-date2').value = S.today;
      $('g-date').max = S.today; $('g-date2').max = S.today;
      rangeInfo();
      quiet('adminListUsers', S.admin).then(function (list) {
        $('g-users').innerHTML = list.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
      }).catch(function () {});
    }
    if (t === 'cp') call('adminListCoupons', S.admin).then(renderAdminCoupons);
    if (t === 'game') call('adminListGames', S.admin).then(renderAdminGames);
  }

  function adminSearch() {
    var opts = { status: $('f-status').value, date: $('f-date').value, name: $('f-name').value };
    call('adminListRecords', S.admin, opts).then(function (res) {
      $('rec-count').textContent = '총 ' + res.total + '건' + (res.total > res.list.length ? ' (최근 ' + res.list.length + '건 표시)' : '') + ' · 기준 ' + res.threshold;
      $('rec-list').innerHTML = res.list.length ? res.list.map(function (r) {
        return '<div class="rec px-box">' +
          '<div class="r-st">' + (r.status === '대기' ? Sprites.get('hourglass') : stampHTML(r.status)) + '</div>' +
          '<div class="r-main"><div class="r-name">' + esc(r.name) + '</div>' +
          '<div class="r-date">' + fmtDate(r.date) + ' · ' + esc(r.status) + (r.admin ? ' (' + esc(r.admin) + ')' : '') + '</div>' +
          (r.granted ? '<div class="r-date" style="color:var(--green-d)">★ ' + esc(r.note) + '</div>' : '') + '</div>' +
          '<span class="r-val ' + (r.pass ? 'pass' : 'fail') + '">' + (r.value == null ? '★' : r.value) + '</span>' +
          '<div class="r-btns">' +
          '<button class="btn btn-green" data-action="review" data-d="승인" data-date="' + r.date + '" data-name="' + esc(r.name) + '"' + (r.status === '승인' ? ' disabled' : '') + '>승인</button>' +
          '<button class="btn btn-red" data-action="review" data-d="비승인" data-date="' + r.date + '" data-name="' + esc(r.name) + '"' + (r.status === '비승인' ? ' disabled' : '') + '>비승인</button>' +
          '</div></div>';
      }).join('') : '<div class="empty">조건에 맞는 기록이 없어요.</div>';
    });
  }

  function review(date, name, decision) {
    call('adminReview', S.admin, date, name, decision).then(function (res) {
      toast(name + ' · ' + decision + ' 처리 완료');
      adminSearch();
    });
  }

  function renderAdminCoupons(res) {
    $('acp-list').innerHTML = res.list.length ? res.list.map(function (c) { return couponHTML(c, true); }).join('') : '<div class="empty">발급된 쿠폰이 없어요.</div>';
  }

  function renderAdminGames(res) {
    var tbl = function (rows) {
      return rows.length ? '<table class="tbl"><tr><th>#</th><th>이름</th><th>최고점</th></tr>' + rows.map(function (x, i) { return '<tr><td>' + (i === 0 ? '👑' : i + 1) + '</td><td>' + esc(x.name) + '</td><td>' + x.score + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">기록 없음</div>';
    };
    $('ag-list').innerHTML =
      '<h3 class="sec-title">🏆 오늘 최고 기록</h3>' + tbl(res.today || []) +
      '<h3 class="sec-title">🏆 주간 최고 기록 <small>(' + esc(res.weekStart || '') + '~)</small></h3>' + tbl(res.week || []) +
      '<h3 class="sec-title">🏆 이번 달 최고 기록</h3>' + tbl(res.ranking || []) +
      '<h3 class="sec-title">🕹 최근 플레이</h3>' +
      (res.list.length ? '<table class="tbl"><tr><th>일시</th><th>이름</th><th>점수</th><th>과일</th></tr>' + res.list.map(function (x) { return '<tr><td>' + esc(x.at.slice(5)) + '</td><td>' + esc(x.name) + '</td><td>' + x.score + '</td><td>' + esc((FruitGame.FRUITS[x.maxLevel] || {}).n || '-') + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">기록 없음</div>');
  }


  /* ── 이벤트 위임 ── */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (el && !el.disabled) {
      var a = el.getAttribute('data-action');
      if (a === 'logout') logout();
      else if (a === 'prev-month') shiftMonth(-1);
      else if (a === 'next-month') shiftMonth(1);
      else if (a === 'input') openInput(el.getAttribute('data-date'));
      else if (a === 'close') closeModal();
      else if (a === 'save') saveInput(el.getAttribute('data-date'));
      else if (a === 'quick') { var inp = $('m-val'); inp.value = Math.max(0, (Number(inp.value) || 0) + Number(el.getAttribute('data-n'))); judge(); }
      else if (a === 'game-restart') FruitGame.reset();
      else if (a === 'game-info') showGameInfo();
      else if (a === 'game-go') startGame();
      else if (a === 'rank-tab') showRanking(el.getAttribute('data-tab'));
      else if (a === 'game-plays') showGameIntro();
      else if (a === 'goto-stamps') { userPane('pane-coupon'); cpTab('shop'); }
      else if (a === 'grant-go') { var pg = S.pendingGrant; closeModal(); if (pg) doGrantRange(pg.name, pg.r, pg.value, pg.memo); }
      else if (a === 'game-rank') showRanking();
      else if (a === 'admin-search') adminSearch();
      else if (a === 'review') review(el.getAttribute('data-date'), el.getAttribute('data-name'), el.getAttribute('data-d'));
      else if (a === 'goto-coupon') { userPane('pane-coupon'); cpTab('have'); closeModal(); }
      else if (a === 'wallet-month') { S.walletYm = el.getAttribute('data-ym'); renderCoupons(); }
      else if (a === 'exchange') askExchange(el.getAttribute('data-id'));
      else if (a === 'do-exchange') doExchange(el.getAttribute('data-id'));
      else if (a === 'use-coupon') call('adminUseCoupon', S.admin, el.getAttribute('data-code')).then(renderAdminCoupons);
      return;
    }
    var nav = e.target.closest('[data-pane]');
    if (nav) return userPane(nav.getAttribute('data-pane'));
    var ct = e.target.closest('[data-cp-tab]');
    if (ct) return cpTab(ct.getAttribute('data-cp-tab'));
    var at = e.target.closest('[data-admin-tab]');
    if (at) return adminTab(at.getAttribute('data-admin-tab'));
    if (e.target.id === 'modal') closeModal();
  });
  var grantMode = 'day';
  function setGrantMode(m) {
    grantMode = m;
    document.querySelectorAll('[data-grant-mode]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-grant-mode') === m); });
    $('g-range-box').classList.toggle('hidden', m !== 'range');
    $('g-date-label').textContent = m === 'range' ? '시작일' : '날짜';
    rangeInfo();
  }
  function rangeDates() {
    var a = $('g-date').value, b = $('g-date2').value;
    if (!a || !b) return null;
    if (a > b) { var t = a; a = b; b = t; }
    var out = [], skip = $('g-skipwk').checked, d = new Date(a + 'T00:00:00'), end = new Date(b + 'T00:00:00'), future = 0, wk = 0;
    while (d <= end) {
      var ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      if (ds > S.today) future++;
      else if (skip && (d.getDay() === 0 || d.getDay() === 6)) wk++;
      else out.push(ds);
      d.setDate(d.getDate() + 1);
    }
    return { from: a, to: b, days: out.length, future: future, weekend: wk };
  }
  function rangeInfo() {
    if (grantMode !== 'range') return;
    var r = rangeDates();
    $('g-range-info').innerHTML = r ? '총 <b>' + r.days + '일</b>에 도장' + (r.weekend ? ' · 주말 ' + r.weekend + '일 제외' : '') + (r.future ? ' · 미래 ' + r.future + '일 제외' : '') + (r.days > 93 ? ' <b style="color:var(--red)">(최대 93일)</b>' : '') : '시작일과 종료일을 고르세요.';
  }
  ['g-date', 'g-date2', 'g-skipwk'].forEach(function (id) { $(id).addEventListener('change', rangeInfo); $(id).addEventListener('input', rangeInfo); });
  document.querySelectorAll('[data-grant-mode]').forEach(function (b) { b.onclick = function () { setGrantMode(b.getAttribute('data-grant-mode')); }; });

  function grantDone(name, label, res) {
    var w = res.wallet;
    var detail = res.days > 1 || grantMode === 'range'
      ? '새로 ' + res.created + '일 · 승인으로 변경 ' + res.updated + '일' + (res.already ? ' · 이미 승인 ' + res.already + '일' : '') + (res.weekend ? ' · 주말 제외 ' + res.weekend + '일' : '')
      : (res.existed ? '기존 기록 승인' : '새 기록');
    $('g-result').innerHTML = '<div class="rec px-box"><div class="r-st">' + Sprites.get('stamp-pass') + '</div>' +
      '<div class="r-main"><div class="r-name">' + esc(name) + '</div><div class="r-date">' + label + ' 합격 도장</div>' +
      '<div class="r-date">' + detail + '</div>' +
      '<div class="r-date">' + (+w.ym.slice(5)) + '월 보유 도장 ' + w.balance + '개 · 출석 ' + w.approved + '/' + w.days + '일</div></div></div>';
    $('g-value').value = ''; $('g-memo').value = '';
    $('g-result').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    toast(name + ' · ' + label + ' 합격 도장 완료!');
  }

  function doGrantRange(name, r, value, memo) {
    call('adminGrantStampRange', S.admin, name, r.from, r.to, value, memo, $('g-skipwk').checked).then(function (res) {
      grantDone(name, fmtDate(r.from) + ' ~ ' + fmtDate(r.to), res);
    });
  }

  $('form-grant').onsubmit = function (e) {
    e.preventDefault();
    var name = $('g-user').value.trim(), date = $('g-date').value, value = $('g-value').value, memo = $('g-memo').value;
    if (!name) return toast('사용자를 입력하세요.');
    if (!date) return toast('날짜를 선택하세요.');
    if (grantMode === 'range') {
      var r = rangeDates();
      if (!r) return toast('종료일을 선택하세요.');
      if (!r.days) return toast('부여할 날짜가 없어요.');
      if (r.days > 93) return toast('한 번에 최대 93일까지 부여할 수 있어요.');
      S.pendingGrant = { name: name, r: r, value: value, memo: memo };
      return openModal('<h3>기간 일괄 도장</h3><div class="center"><div class="big-stamp" style="width:30%">' + Sprites.get('stamp-pass') + '</div>' +
        '<p><b>' + esc(name) + '</b><br>' + fmtDate(r.from) + ' ~ ' + fmtDate(r.to) + '</p>' +
        '<p>총 <b>' + r.days + '일</b>에 합격 도장을 찍을까요?</p>' +
        '<p class="hint">' + (r.weekend ? '주말 ' + r.weekend + '일 제외 · ' : '') + '이미 승인된 날은 그대로 둬요.</p></div>' +
        '<div class="actions"><button class="btn btn-dark" data-action="close">취소</button><button class="btn btn-green" data-action="grant-go">찍기</button></div>');
    }
    call('adminGrantStamp', S.admin, name, date, value, memo).then(function (res) { grantDone(name, fmtDate(date), res); });
  };
  $('f-status').onchange = adminSearch;
  $('f-date').onchange = adminSearch;

  /* ── 시작 ── */
  $('logo').innerHTML = Sprites.get('logo');
  Sprites.hydrate();
  var saved = store.get('dot_user');
  if (saved) $('in-user-name').value = saved;
  quiet('getBootstrap').then(function (b) {
    S.threshold = b.threshold; S.today = b.today;
    $('boot-th').textContent = b.threshold;
  }).catch(function () {});
})();
</script>
